<section class="hero" id="Accueil">
  <div class="hero-bg"></div>
  <div class="hero-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- ══ CONTENU GAUCHE ══ -->
  <div class="hero-content">

    <div class="hero-badge">
      <span class="badge-dot"></span>
      <span data-i18n="hero.live_badge">Programme actif — Fideliio</span>
    </div>

    <div class="hero-title-scroll">
    <h1 class="hero-title">
      <span class="line-1" data-i18n="hero.h1_l1">CHAQUE ACHAT</span>
      <span class="line-2" data-i18n-html="hero.line2_html">VOUS <span class="highlight">RÉCOMPENSE</span></span>
    </h1>
    </div>

    <p class="hero-sub" data-i18n="hero.lead">
      Cumulez des points à chaque visite, débloquez des récompenses exclusives
      et profitez d’offres personnalisées — directement depuis votre téléphone.
    </p>

    <!-- ══ TÉLÉPHONE MOBILE ══ -->
    <div class="hero-phone-wrap hero-phone-mobile">
      <div class="hero-phone">
        <div class="phone-frame">
          <div class="phone-btn-vol"></div>
          <div class="phone-screen">
            <div class="phone-dynamic-island"></div>
            <div class="phone-screen-content">
              <img src="img/screen-fideliio.jpeg" alt="" width="393" height="852" style="width:100%;height:100%;object-fit:cover;object-position:top;display:block;">
            </div>
            <div class="phone-home-bar"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ══ BOUTONS CTA ══ -->
    <div class="hero-actions">
      <a href="#tarifs" class="btn-primary" data-i18n="hero.cta_go">Lancez-vous maintenant</a>
      <a href="contact.html" class="btn-secondary" data-i18n="hero.cta_contact">Nous contacter</a>
    </div>

    <!-- ══ STATS ══ -->
    <div class="hero-stats">
      <div class="hero-stat">
        <div class="stat-num" data-i18n="hero.stat_val_members">12k+</div>
        <div class="stat-label" data-i18n="hero.stat_lab_members">Membres actifs</div>
      </div>
      <div class="hero-stat">
        <div class="stat-num" data-i18n="hero.stat_val_rating">4.8</div>
        <div class="stat-label" data-i18n="hero.stat_lab_rating">Note moyenne</div>
      </div>
      <div class="hero-stat">
        <div class="stat-num" data-i18n="hero.stat_val_sat">98%</div>
        <div class="stat-label" data-i18n="hero.stat_lab_sat">Satisfaction</div>
      </div>
    </div>

  </div>

  <!-- ══ TÉLÉPHONE DESKTOP ══ -->
  <div class="hero-phone-wrap hero-phone-desktop">
    <div class="hero-phone">
      <div class="phone-frame">
        <div class="phone-btn-vol"></div>
        <div class="phone-screen">
          <div class="phone-dynamic-island"></div>
          <div class="phone-screen-content">
            <img src="img/screen-fideliio.jpeg" alt="" width="393" height="852" style="width:100%;height:100%;object-fit:cover;object-position:top;display:block;">
          </div>
          <div class="phone-home-bar"></div>
        </div>
      </div>
    </div>
  </div>

</section>
